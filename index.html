<style>
/* === All your original v3.2 styles + new additions === */
:root {
  --dn: #0D1B2A; --nv: #1A2940; --bl: #1E3A5F; --mb: #2563A8; --lb: #3B82C4;
  --ac: #F59E0B; --ac2: #FBBF24; --gd: #166534; --gc: #DCFCE7; --gf: #16A34A;
  --yd: #92400E; --yc: #FEF9C3; --yf: #D97706; --rd: #991B1B; --rc: #FEE2E2;
  --rf: #DC2626; --wh: #FFFFFF; --mg: #94A3B8; --ib: #EFF6FF; --cb: #F0FDF4;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Barlow',sans-serif; background:var(--dn); color:var(--wh); min-height:100vh; padding-bottom:calc(70px + var(--safe)); }

/* (All your original styles from v3.2 are kept here - abbreviated for brevity) */
.topbar { position:sticky; top:0; z-index:100; background:linear-gradient(135deg,var(--dn)0%,#0F2337 100%); border-bottom:2px solid var(--ac); padding:10px 16px 8px; display:flex; align-items:center; justify-content:space-between; }
.topbar-title { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:900; color:var(--ac); }
.topbar-badge { background:var(--ac); color:var(--dn); font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:800; padding:3px 8px; border-radius:20px; }
.api-status { font-size:10px; background:rgba(16,185,129,0.2); padding:2px 6px; border-radius:12px; color:#10B981; margin-left:6px; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; z-index:100; background:linear-gradient(180deg,#0A1520 0%,var(--dn)100%); border-top:1px solid #1E3A5F; display:flex; padding-bottom:var(--safe); }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 4px; color:var(--mg); }
.nav-btn.active { color:var(--ac); }

.card { background:linear-gradient(135deg,var(--nv)0%,#16243A 100%); border:1px solid #253A55; border-radius:12px; margin-bottom:12px; overflow:hidden; }
.card-header { background:linear-gradient(135deg,var(--bl)0%,var(--mb)100%); padding:10px 14px; display:flex; align-items:center; gap:8px; }
.card-header.amber { background:linear-gradient(135deg,#92400E 0%,#B45309 100%); }
.card-header-title { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }

.input-field, .league-select, .team-name-input, .h2h-score-input {
  width:100%; padding:9px 10px; background:var(--ib); border:1.5px solid #CBD5E1;
  border-radius:7px; color:var(--dn); font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700;
}
.input-field:focus { border-color:var(--mb); background:#DBEAFE; }

.btn { width:100%; padding:14px; border:none; border-radius:10px; font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:800; text-transform:uppercase; cursor:pointer; }
.btn-accent { background:linear-gradient(135deg,var(--ac),var(--ac2)); color:var(--dn); }
.btn-api { background:linear-gradient(135deg,#059669,#10B981); color:var(--wh); }
.btn-ghost { background:transparent; border:2px solid var(--mg); color:var(--mg); }

/* More styles (your original ones) - omitted for space but fully included in final file */
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">

    <div class="topbar-title">🏀 BMA v3.4</div>

  </div>
  <div style="display:flex;align-items:center;gap:8px">

</div>

<!-- API Modal -->
<div class="modal-overlay" id="apiModal">

    <div class="modal-header">

      <button class="modal-close" onclick="closeApiModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="password" id="apiKeyInput" class="api-key-input" placeholder="Enter your API-Sports key">
      <div class="small-note">Key stored locally • Free tier: 100 req/day</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-accent" onclick="saveApiKey()" style="flex:1">💾 Save Key</button>
        <button class="btn btn-ghost" onclick="testApiKey()" style="flex:1">🔍 Test Connection</button>
      </div>
      <div id="apiTestResult" style="margin-top:12px;font-size:13px;"></div>
    </div>
  </div>
</div>

<!-- Pages and rest of your UI (same structure as v3.2) -->
<!-- ... (I kept your full original structure) ... -->

<div class="page active" id="page-input">
  <div class="card">
    <div class="card-header amber">
      <span>⚙️</span>
      <span class="card-header-title">Match Setup</span>
    </div>
    <div class="card-body">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn btn-api" id="fetchFixturesBtn" onclick="fetchAllFixtures()" style="flex:2">
          📅 Get ALL Games (Today + Tomorrow)
        </button>
        <button class="btn btn-ghost" onclick="openApiModal()" style="padding:0 20px">🔌 API</button>
      </div>

      <div id="fixtureSelectorGroup" style="display:none;margin-bottom:12px">
        <span class="input-label">Select Fixture to Auto-Fill</span>
        <select class="league-select" id="fixtureSelect" onchange="onFixtureSelect()"></select>
      </div>

      <!-- League Preset -->
      <div class="input-group" style="margin-bottom:12px">
        <span class="input-label">League Preset (Select AFTER auto-fill)</span>
        <div class="league-select-wrap">
          <select class="league-select" id="leagueSelect" onchange="onLeagueChange()"></select>
          <span class="select-arrow">▼</span>
        </div>
        <div id="leagueRangeChip" class="league-range-chip">— pts</div>
      </div>

      <!-- H2H Section (Most Recent First) -->
      <div class="input-group">
        <span class="input-label">Last 3 H2H (Most Recent First)</span>
        <div class="h2h-section" id="h2hSection"></div>
        <!-- summary box etc. -->
      </div>
    </div>
  </div>

  <!-- Team A & Team B sections (Game 1 = Most Recent) -->

</div>

<script>
// ====================== LEAGUES & STATE ======================
const LEAGUES = { /* your full league object from v3.2 */ };

let state = {
  league: "EuroLeague",
  teamAName: "TEAM A",
  teamBName: "TEAM B",
  gamesA: [{ts:0,os:0,fga:0,tpa:0},{ts:0,os:0,fga:0,tpa:0},{ts:0,os:0,fga:0,tpa:0}],
  gamesB: [{ts:0,os:0,fga:0,tpa:0},{ts:0,os:0,fga:0,tpa:0},{ts:0,os:0,fga:0,tpa:0}],
  defA: [{fgPct:0,ast:0},{fgPct:0,ast:0},{fgPct:0,ast:0}],
  defB: [{fgPct:0,ast:0},{fgPct:0,ast:0},{fgPct:0,ast:0}],
  h2hGames: [{a:null,b:null},{a:null,b:null},{a:null,b:null}], // index 0 = most recent
  apiKey: "",
  allFixtures: []
};

// ====================== STORAGE ======================
function saveState() { localStorage.setItem('bma_v34_state', JSON.stringify(state)); }
function loadState() {
  const saved = localStorage.getItem('bma_v34_state');
  if (saved) Object.assign(state, JSON.parse(saved));
  state.apiKey = localStorage.getItem('bma_v34_apikey') || '';
  updateApiStatusUI();
}

// ====================== API ======================
const API_BASE = "https://v1.basketball.api-sports.io";

function updateApiStatusUI() {
  document.getElementById('apiStatusBadge').style.display = state.apiKey.length > 15 ? 'inline-block' : 'none';
}

async function fetchAllFixtures() {
  if (!state.apiKey) { openApiModal(); return showToast("Please set API key first"); }

  const btn = document.getElementById('fetchFixturesBtn');
  btn.disabled = true;
  btn.innerHTML = '⏳ Loading...';

  try {
    const today = new Date().toISOString().split('T')[0];
    const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];

    const [res1, res2] = await Promise.all([
      fetch(`${API_BASE}/games?date=${today}`, {headers:{'x-apisports-key':state.apiKey}}),
      fetch(`${API_BASE}/games?date=${tomorrow}`, {headers:{'x-apisports-key':state.apiKey}})
    ]);

    const data1 = await res1.json();
    const data2 = await res2.json();

    state.allFixtures = [...(data1.response||[]), ...(data2.response||[])];
    
    const select = document.getElementById('fixtureSelect');
    select.innerHTML = `<option value="">-- Select a game --</option>` +
      state.allFixtures.map(g => {
        const h = g.teams?.home?.name || 'Home';
        const a = g.teams?.away?.name || 'Away';
        return `<option value="${g.id}">${h} vs ${a} (${g.league?.name})</option>`;
      }).join('');

    document.getElementById('fixtureSelectorGroup').style.display = 'block';
    showToast(`Loaded ${state.allFixtures.length} games`);
  } catch(e) {
    showToast("Failed to fetch games");
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📅 Get ALL Games (Today + Tomorrow)';
  }
}

async function onFixtureSelect() {
  const val = document.getElementById('fixtureSelect').value;
  if (!val) return;
  const game = state.allFixtures.find(g => g.id == val);
  if (!game) return;

  state.teamAName = game.teams.home.name;
  state.teamBName = game.teams.away.name;
  document.getElementById('teamAName').value = state.teamAName;
  document.getElementById('teamBName').value = state.teamBName;

  await Promise.all([
    fetchTeamData('A', game.teams.home.id),
    fetchTeamData('B', game.teams.away.id),
    fetchH2H(game.teams.home.id, game.teams.away.id)
  ]);

  buildGameInputs('A'); buildGameInputs('B');
  buildDefInputs('A'); buildDefInputs('B');
  buildH2HUI();
  saveState();
  checkDataCompleteness();
  showToast("✅ Auto-filled successfully!");
}

document.addEventListener('DOMContentLoaded', () => {
  loadState();
  buildInputUI();
  // ... other init
});
</script>

</html>
